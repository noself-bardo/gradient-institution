name: Crisis Liturgies Builder Tests

on:
  pull_request:
    paths:
      - "CRISIS_LITURGIES/CL_BUILDER/**"
      - ".github/workflows/cl-builder-tests.yml"
  push:
    branches:
      - main
    paths:
      - "CRISIS_LITURGIES/CL_BUILDER/**"
      - ".github/workflows/cl-builder-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CRISIS_LITURGIES/CL_BUILDER
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install builder
        run: python -m pip install -e .
      - name: Run tests
        run: python -m unittest discover -s tests -v
