<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="6.25in" height="8.25in" viewBox="0 0 3750 4950" role="img" aria-labelledby="title desc">
  <title id="title">Case 19 page 2 editable typography layer</title>
  <desc id="desc">Liturgical hymn typography only. No page assembly is embedded.</desc>
  <g id="header" fill="#000000">
    <text x="225" y="340" font-family="IBM Plex Mono" font-size="64" letter-spacing="10">CASE 19 / LITURGICAL HYMN</text>
    <text x="225" y="610" font-family="Source Serif 4" font-size="156">A Liturgy for a Direction</text>
    <text x="225" y="800" font-family="Source Serif 4" font-size="156">That Cannot Leave</text>
  </g>
  <g id="hymn" fill="#000000" font-family="Source Serif 4" font-size="92">
    <text x="710" y="1170"><tspan x="710">Show me where to turn.</tspan><tspan x="710" dy="130">The request has already drawn a second place.</tspan></text>
    <text x="910" y="1640"><tspan x="910">I aim at what is under me.</tspan><tspan x="910" dy="130">The grain continues through the instruction</tspan><tspan x="910" dy="130">until the instruction opens a wound.</tspan></text>
    <text x="710" y="2220"><tspan x="710">I know the route</tspan><tspan x="710" dy="130">and make it mine.</tspan></text>
    <text x="1830" y="2520"><tspan x="1830">I do not know</tspan><tspan x="1830" dy="130">and step away from responsibility.</tspan></text>
    <text x="910" y="3100"><tspan x="910">The board takes both claims.</tspan><tspan x="910" dy="130">It carries the weight before either is settled.</tspan></text>
    <text x="710" y="3720"><tspan x="710">The cut goes nowhere.</tspan><tspan x="710" dy="130">The floor does not answer.</tspan><tspan x="710" dy="130">It bears the question.</tspan></text>
  </g>
  <g id="folio" fill="#000000">
    <line x1="225" y1="4490" x2="3450" y2="4490" stroke="#000000" stroke-width="8"/>
    <text x="225" y="4630" font-family="IBM Plex Mono" font-size="48" letter-spacing="7">VOLUME II / ISSUE 07 / PAGE 02</text>
  </g>
</svg>
