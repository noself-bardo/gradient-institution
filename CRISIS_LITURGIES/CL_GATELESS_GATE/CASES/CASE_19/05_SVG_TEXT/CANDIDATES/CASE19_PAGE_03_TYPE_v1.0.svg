<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="6.25in" height="8.25in" viewBox="0 0 3750 4950" role="img" aria-labelledby="title desc">
  <title id="title">Case 19 page 3 editable typography layer</title>
  <desc id="desc">Gradient Translation typography only. No page assembly is embedded.</desc>
  <g id="header" fill="#000000">
    <text x="300" y="340" font-family="IBM Plex Mono" font-size="64" letter-spacing="10">CASE 19 / GRADIENT TRANSLATION</text>
    <text x="300" y="650" font-family="Source Serif 4" font-size="190">The Route Above the Ground</text>
    <text x="300" y="870" font-family="Source Serif 4" font-size="68">
      <tspan x="300">Routing systems often begin by separating instruction from condition.</tspan>
      <tspan x="300" dy="96">A map, workflow, access sequence, or completion marker becomes the</tspan>
      <tspan x="300" dy="96">authorized layer through which the ground may be encountered.</tspan>
    </text>
  </g>
  <g id="equation">
    <rect x="300" y="1420" width="3225" height="410" fill="#B8C0C8"/>
    <text x="415" y="1675" font-family="IBM Plex Mono" font-size="72" letter-spacing="5" fill="#000000">GROUND → EXTERNAL DIRECTION LAYER → COMPLIANCE → LOSS OF GROUND</text>
  </g>
  <g id="fields" fill="#000000">
    <text x="300" y="2180" font-family="IBM Plex Mono" font-size="58" letter-spacing="8">INPUT</text>
    <text x="300" y="2300" font-family="Source Serif 4" font-size="64"><tspan x="300">A person asks for, receives,</tspan><tspan x="300" dy="90">or is assigned a direction.</tspan></text>
    <text x="300" y="2730" font-family="IBM Plex Mono" font-size="58" letter-spacing="8">CONTROL LAYER</text>
    <text x="300" y="2850" font-family="Source Serif 4" font-size="64"><tspan x="300">The lived condition is abstracted</tspan><tspan x="300" dy="90">into a route held elsewhere.</tspan></text>
    <text x="300" y="3280" font-family="IBM Plex Mono" font-size="58" letter-spacing="8">RULE</text>
    <text x="300" y="3400" font-family="Source Serif 4" font-size="64"><tspan x="300">Compliance with the indicator</tspan><tspan x="300" dy="90">stands in for contact with ground.</tspan></text>
    <text x="1950" y="2180" font-family="IBM Plex Mono" font-size="58" letter-spacing="8">FAILURE</text>
    <text x="1950" y="2300" font-family="Source Serif 4" font-size="64"><tspan x="1950">The routing layer becomes more</tspan><tspan x="1950" dy="90">authoritative than the conditions</tspan><tspan x="1950" dy="90">it claims merely to describe.</tspan></text>
    <text x="1950" y="2870" font-family="IBM Plex Mono" font-size="58" letter-spacing="8">MATERIAL COUNTERFACT</text>
    <text x="1950" y="2990" font-family="Source Serif 4" font-size="64"><tspan x="1950">Direction cannot be separated</tspan><tspan x="1950" dy="90">from the load-bearing surface.</tspan><tspan x="1950" dy="90">Moving the sign means removing</tspan><tspan x="1950" dy="90">the floor.</tspan></text>
  </g>
  <g id="limit" fill="#000000">
    <line x1="1950" y1="4200" x2="3525" y2="4200" stroke="#000000" stroke-width="8"/>
    <text x="1950" y="4330" font-family="IBM Plex Mono" font-size="52" letter-spacing="7">LIMIT</text>
    <text x="1950" y="4450" font-family="Source Serif 4" font-size="58"><tspan x="1950">This translation names an institutional</tspan><tspan x="1950" dy="82">structure. It does not exhaust the case</tspan><tspan x="1950" dy="82">or convert Zen into interface theory.</tspan></text>
  </g>
</svg>
