[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "crisis-liturgies-builder"
version = "0.1.0"
description = "Deterministic compiler and QC layer for Crisis Liturgies volumes"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.21",
  "PyYAML>=6.0",
  "Pillow>=10.0",
]

[project.scripts]
cl-builder = "cl_builder.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cl_builder*"]
